<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Card T2 Vitrine na Praia</title>
<style>
  @font-face { font-family: 'Oswald'; font-weight: 700; src: url(fonts/Oswald-wght-700.woff2) format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 500; src: url(fonts/Montserrat-wght-500.woff2) format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 600; src: url(fonts/Montserrat-wght-600.woff2) format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 700; src: url(fonts/Montserrat-wght-700.woff2) format('woff2'); }
  @font-face { font-family: 'Montserrat'; font-weight: 800; src: url(fonts/Montserrat-wght-800.woff2) format('woff2'); }
  @font-face { font-family: 'Great Vibes'; font-weight: 400; src: url(fonts/Great-Vibes.woff2) format('woff2'); }
  /* Troque só estes campos a cada episódio (ou passe ?ep=02&predio=...&bairro=...&foto=... na URL) */
  :root {
    --navy: #0b1c36;
    --navy-2: #13294d;
    --gold: #d4a94f;
    --gold-light: #f3d488;
    --white: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--navy); }
  .card {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    background: radial-gradient(120% 90% at 0% 0%, var(--navy-2) 0%, var(--navy) 60%);
    font-family: 'Montserrat', sans-serif; color: var(--white);
  }

  /* Foto do imóvel com o corte diagonal dourado da identidade */
  .photo {
    position: absolute; inset: 0;
    background-size: cover; background-position: center;
    clip-path: polygon(50% 0, 100% 0, 100% 100%, 38% 100%);
  }
  .photo::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(11,28,54,.55) 0%, rgba(11,28,54,0) 35%), linear-gradient(200deg, rgba(8,21,42,.55) 0%, rgba(8,21,42,0) 45%);
  }
  .diag {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    clip-path: polygon(49.3% 0, 50% 0, 38% 100%, 37.3% 100%);
  }

  /* Logo */
  .logo { position: absolute; left: 96px; top: 70px; display: flex; flex-direction: column; align-items: center; width: 560px; }
  .logo svg { width: 270px; height: 125px; }
  .logo .name { font-weight: 800; font-size: 58px; letter-spacing: 1px; line-height: 1; margin-top: 6px; white-space: nowrap; }
  .logo .name b { color: var(--gold); font-weight: 800; }
  .logo .tag { font-weight: 600; font-size: 20px; letter-spacing: 6px; margin-top: 10px; color: #dfe6f2; }
  .logo .rule { width: 260px; height: 2px; margin-top: 12px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }

  /* Temporada / episódio */
  .season {
    position: absolute; left: 96px; top: 400px;
    display: inline-block; padding: 12px 28px 10px;
    background: linear-gradient(90deg, var(--gold-light), var(--gold));
    color: var(--navy); font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 34px; letter-spacing: 6px;
    clip-path: polygon(0 0, 100% 0, 94% 100%, 0 100%);
    padding-right: 48px;
  }
  .episode {
    position: absolute; left: 90px; top: 500px;
    font-family: 'Oswald', sans-serif; font-weight: 700; font-size: 138px; line-height: 1; letter-spacing: 1px;
    text-shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  .episode span { color: var(--gold); }
  .property { position: absolute; left: 96px; top: 690px; max-width: 600px; }
  .property .building { font-weight: 800; font-size: 42px; color: var(--gold-light); line-height: 1.15; }
  .property .place { font-weight: 500; font-size: 28px; margin-top: 8px; color: #dfe6f2; }

  /* Apresentador */
  .host { position: absolute; left: 1340px; top: 540px; display: flex; flex-direction: column; align-items: center; }
  .host .ring {
    width: 300px; height: 300px; border-radius: 50%; padding: 8px;
    background: linear-gradient(135deg, var(--gold-light), var(--gold) 60%, #9c7a2f);
    box-shadow: 0 18px 40px rgba(0,0,0,.45);
  }
  .host .ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .host .who {
    margin-top: -26px; padding: 10px 26px; background: var(--navy); border: 2px solid var(--gold);
    border-radius: 40px; font-weight: 700; font-size: 24px; white-space: nowrap; position: relative;
  }
  .host .who small { display: block; font-weight: 500; font-size: 15px; letter-spacing: 3px; color: var(--gold-light); text-align: center; }
  .script {
    position: absolute; left: 1140px; top: 250px; width: 700px; text-align: center;
    font-family: 'Great Vibes', cursive; font-size: 72px; line-height: 1.05; color: var(--white);
    text-shadow: 0 3px 16px rgba(0,0,0,.9), 0 0 4px rgba(0,0,0,.6);
    transform: rotate(-4deg);
  }

  /* Barra inferior */
  .bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 120px;
    background: rgba(8,21,42,.96); border-top: 2px solid var(--gold);
    display: flex; align-items: center; padding: 0 96px;
  }
  .bar svg { width: 62px; height: 62px; flex: none; }
  .bar .sep { width: 2px; height: 60px; background: rgba(255,255,255,.35); margin: 0 30px; }
  .bar .slogan { font-weight: 700; font-size: 26px; line-height: 1.35; }
  .bar .slogan em { font-style: normal; color: var(--gold); }
  .bar .sub {
    margin-left: auto; display: flex; align-items: center; gap: 14px;
    background: #e02424; border-radius: 12px; padding: 14px 26px; font-weight: 800; font-size: 26px; letter-spacing: 1px;
  }
  .bar .sub svg { width: 46px; height: 34px; }
</style>
</head>
<body>
<div class="card">
  <div class="photo" id="photo"></div>
  <div class="diag"></div>

  <div class="logo">
    <!-- Logo do programa: casa + sol + ondas + gaivotas, nas cores da marca -->
    <svg viewBox="0 0 260 120" aria-hidden="true">
      <defs>
        <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#e0a93e"/></linearGradient>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d98f"/><stop offset="1" stop-color="#c8963c"/></linearGradient>
        <linearGradient id="sea1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4fb6f0"/><stop offset="1" stop-color="#2a7fd0"/></linearGradient>
        <linearGradient id="sea2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d5aa8"/><stop offset="1" stop-color="#153f7c"/></linearGradient>
      </defs>
      <!-- sol nascendo atrás da casa -->
      <path d="M150 78 A42 42 0 0 1 234 78 Z" fill="url(#sun)"/>
      <!-- casa -->
      <path d="M44 80 L112 26 L172 72" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M66 64 V80 M158 62 V80" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
      <g fill="url(#gold)"><rect x="100" y="50" width="10" height="10" rx="1"/><rect x="113" y="50" width="10" height="10" rx="1"/><rect x="100" y="63" width="10" height="10" rx="1"/><rect x="113" y="63" width="10" height="10" rx="1"/></g>
      <!-- ondas -->
      <path d="M18 92 C55 72 92 104 132 88 S205 70 244 84 L244 96 C205 84 170 104 132 100 S58 88 18 104 Z" fill="url(#sea1)"/>
      <path d="M34 106 C70 92 104 116 142 104 S208 92 234 100 L234 108 C205 102 176 118 142 114 S74 104 34 114 Z" fill="url(#sea2)"/>
      <!-- gaivotas -->
      <path d="M196 20 q7 -7 14 0 q7 -7 14 0" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <path d="M220 38 q5 -5 10 0 q5 -5 10 0" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <div class="name">VITRINE <b>NA PRAIA</b></div>
    <div class="tag">IMÓVEIS NO LITORAL NORTE</div>
    <div class="rule"></div>
  </div>

  <div class="season">TEMPORADA 2</div>
  <div class="episode">EPISÓDIO <span id="ep">01</span></div>
  <div class="property">
    <div class="building" id="predio">Edifício Absoluto Palace</div>
    <div class="place" id="bairro">Navegantes · Capão da Canoa/RS</div>
  </div>

  <div class="script">Vamos encontrar o seu<br>próximo endereço?</div>

  <div class="host">
    <div class="ring"><img src="assets/roberto.jpg" alt="Roberto Carvalho Guedes"></div>
    <div class="who"><small>APRESENTAÇÃO</small>Roberto Carvalho Guedes</div>
  </div>

  <div class="bar">
    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 30 L32 10 L56 30 M16 24 V54 H48 V24 M27 54 V38 H37 V54" fill="none" stroke="#d4a94f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <div class="sep"></div>
    <div class="slogan">DO EPISÓDIO À VISITA.<br><em>ENCONTRE SEU IMÓVEL IDEAL EM ATÉ 30 DIAS.</em></div>
    <div class="sub">
      <svg viewBox="0 0 46 34" aria-hidden="true"><rect width="46" height="34" rx="9" fill="#fff"/><path d="M18 9 L31 17 L18 25 Z" fill="#e02424"/></svg>
      INSCREVA-SE
    </div>
  </div>
</div>
<script>
  // Parâmetros opcionais por episódio: card.html?ep=02&predio=Edifício%20Milano&bairro=Centro&foto=assets/ep02.jpg
  const q = new URLSearchParams(location.search);
  const set = (id, v) => { if (v) document.getElementById(id).textContent = v; };
  set('ep', q.get('ep')); set('predio', q.get('predio')); set('bairro', q.get('bairro'));
  document.getElementById('photo').style.backgroundImage = `url('${q.get('foto') || 'assets/ep01-absoluto-hall.jpg'}')`;
</script>
</body>
</html>
